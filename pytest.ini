[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
markers =
    pg: needs a real PostgreSQL copy of grom (tests/pg); skipped when unreachable
# Anything Litestar 3.0 removes fails the run instead of piling up as a warning.
filterwarnings =
    error::litestar.exceptions.base_exceptions.LitestarDeprecationWarning
