# Run from the repository root:
#   docker compose -f images/docker-compose.yml up -d --build
#
# Requires an existing ../.env (see .env.example in the repo root) with
# SESSION_SECRET filled in — without it the app fails at startup. The DB_*
# variables only seed config_data/db_profiles.json, but at least one complete
# set is needed on first start: the Settings page is behind the login.

# Without an explicit name the project would be named after the directory ("images")
# and the container would become images-app-1
name: litestar-grom

services:
  app:
    build:
      context: ..
      dockerfile: images/Dockerfile
    image: litestar-grom:latest
    env_file:
      - ../.env
    ports:
      # Inside the container the app listens on ${SERVER_PORT:-8011} (see the Dockerfile
      # CMD). If you change SERVER_PORT in .env, fix the right-hand side here too.
      - "8011:8011"
    volumes:
      - parser_data:/app/parser_data
      - app_log:/app/log
      # DB connections added through the Settings page. Without a volume the list
      # would fall back to the .env seed on every image rebuild.
      - config_data:/app/config_data
    restart: unless-stopped

volumes:
  parser_data:
  app_log:
  config_data:
