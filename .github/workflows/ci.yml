name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Settings() reads it at import time; a throwaway value is enough for the tests.
      SESSION_SECRET: "00000000000000000000000000000000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - run: pip install -r requirements-dev.txt -c constraints.txt

      - name: ruff check
        run: ruff check --output-format github .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy .

      # Same version as biome.json's $schema, so CI and a local `biome lint static/js` agree.
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.6.6

      - name: biome (static/js)
        run: biome ci static/js

      # tests/pg needs a copy of the grom database, which CI does not have.
      - name: pytest
        run: pytest -m "not pg"
