[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["venv", ".venv", "log", "parser_data", "design_number_data", "config_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]
# E501: what the formatter leaves is long strings and SQL
# ASYNC230/240: only small local log-file writes after an operation
ignore = ["E501", "ASYNC230", "ASYNC240"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["litestar.params.Body", "litestar.params.Parameter", "litestar.di.Provide"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^venv/", "^\\.venv/"]

# Tests pass fakes (FakeRequest, owner=None, bad rows on purpose) and read fields
# of results they have just asserted on — strict argument/None checks are noise there.
[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["union-attr", "arg-type"]
